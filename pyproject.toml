[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "organization-matching"
version = "0.1.0"
description = "Deterministic organization entity resolution and BCA/BQP registry lookup"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["preprocessing", "matching", "search"]
