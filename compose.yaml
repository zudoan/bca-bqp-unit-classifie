services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: organization_registry
      POSTGRES_USER: organization_user
      POSTGRES_PASSWORD: organization_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organization_user -d organization_registry"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - organization_registry_data:/var/lib/postgresql/data

volumes:
  organization_registry_data:

